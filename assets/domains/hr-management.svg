<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradHR" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2E1065"/>
      <stop offset="50%" stop-color="#4C1D95"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#bgGradHR)"/>

  <!-- Header -->
  <rect x="50" y="40" width="700" height="60" rx="12" fill="#3B0764" stroke="#D946EF" stroke-width="1.5"/>
  <text x="75" y="77" fill="#F0ABFC" font-family="system-ui, sans-serif" font-size="20" font-weight="bold">HR MANAGEMENT &amp; TALENT ACQUISITION</text>
  <text x="590" y="76" fill="#E879F9" font-family="system-ui, sans-serif" font-size="14">PEOPLE OPS • HIRING</text>

  <!-- Left: Candidate Pipeline Board -->
  <rect x="50" y="120" width="340" height="420" rx="16" fill="#3B0764" stroke="#A855F7" stroke-width="1.5"/>
  <text x="75" y="155" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="16" font-weight="bold">Talent Sourcing Pipeline</text>

  <rect x="75" y="180" width="290" height="60" rx="8" fill="#581C87"/>
  <circle cx="105" cy="210" r="16" fill="#D946EF"/>
  <text x="130" y="205" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">Lead Senior Engineer</text>
  <text x="130" y="225" fill="#D8B4FE" font-family="system-ui, sans-serif" font-size="11">Sourced via LinkedIn • 8 Candidates</text>

  <rect x="75" y="255" width="290" height="60" rx="8" fill="#581C87"/>
  <circle cx="105" cy="285" r="16" fill="#A855F7"/>
  <text x="130" y="280" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">Technical Assessment</text>
  <text x="130" y="300" fill="#D8B4FE" font-family="system-ui, sans-serif" font-size="11">NTI Qualifier Test • 24 In-Progress</text>

  <rect x="75" y="330" width="290" height="60" rx="8" fill="#581C87"/>
  <circle cx="105" cy="360" r="16" fill="#10B981"/>
  <text x="130" y="355" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">Offer Letter Rolled Out</text>
  <text x="130" y="375" fill="#D8B4FE" font-family="system-ui, sans-serif" font-size="11">Stipend: ₹30,000/mo • 10 Accepted</text>

  <text x="75" y="440" fill="#E879F9" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">Retention Rate: 94.8%</text>
  <text x="75" y="470" fill="#D8B4FE" font-family="system-ui, sans-serif" font-size="12">Diversity &amp; Inclusion Compliance: 100%</text>

  <!-- Right: Metrics -->
  <rect x="410" y="120" width="340" height="200" rx="16" fill="#3B0764" stroke="#A855F7" stroke-width="1.5"/>
  <text x="435" y="155" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="16" font-weight="bold">Recruitment Velocity</text>
  
  <rect x="435" y="180" width="140" height="75" rx="10" fill="#2E1065"/>
  <text x="450" y="205" fill="#D8B4FE" font-family="system-ui, sans-serif" font-size="12">Time-to-Hire</text>
  <text x="450" y="238" fill="#F0ABFC" font-family="system-ui, sans-serif" font-size="24" font-weight="bold">12 Days</text>

  <rect x="590" y="180" width="140" height="75" rx="10" fill="#2E1065"/>
  <text x="605" y="205" fill="#D8B4FE" font-family="system-ui, sans-serif" font-size="12">Offer Acceptance</text>
  <text x="605" y="238" fill="#34D399" font-family="system-ui, sans-serif" font-size="24" font-weight="bold">92%</text>

  <!-- Lower Right: Stats -->
  <rect x="410" y="340" width="340" height="200" rx="16" fill="#3B0764" stroke="#A855F7" stroke-width="1.5"/>
  <text x="435" y="375" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="16" font-weight="bold">Employee Engagement Score</text>

  <circle cx="500" cy="450" r="45" fill="none" stroke="#581C87" stroke-width="10"/>
  <circle cx="500" cy="450" r="45" fill="none" stroke="#D946EF" stroke-width="10" stroke-dasharray="240" stroke-dashoffset="40"/>
  <text x="480" y="458" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="20" font-weight="bold">8.9</text>

  <text x="580" y="440" fill="#F0ABFC" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">eNPS: +68</text>
  <text x="580" y="465" fill="#D8B4FE" font-family="system-ui, sans-serif" font-size="12">World-Class Category</text>
</svg>
