<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradBCA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#03254C"/>
      <stop offset="50%" stop-color="#1167B1"/>
      <stop offset="100%" stop-color="#021B36"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#bgGradBCA)"/>

  <!-- Header -->
  <rect x="50" y="40" width="700" height="60" rx="12" fill="#03254C" stroke="#2A9DF4" stroke-width="1.5"/>
  <text x="75" y="77" fill="#D0E8FF" font-family="system-ui, sans-serif" font-size="20" font-weight="bold">COMPUTER APPLICATIONS (BCA / B.SC. IT)</text>
  <text x="590" y="76" fill="#D0E8FF" font-family="system-ui, sans-serif" font-size="14">DATA STRUCTURES • WEB</text>

  <!-- Left: Code & DSA -->
  <rect x="50" y="120" width="340" height="420" rx="16" fill="#0A3663" stroke="#2A9DF4" stroke-width="1.5"/>
  <text x="75" y="155" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="16" font-weight="bold">Core Computer Science Stack</text>

  <!-- Code Card -->
  <rect x="75" y="180" width="290" height="220" rx="10" fill="#021B36" stroke="#2A9DF4" stroke-width="1"/>
  <text x="90" y="210" fill="#38BDF8" font-family="monospace" font-size="12">// Binary Search Tree Algorithm</text>
  <text x="90" y="235" fill="#F43F5E" font-family="monospace" font-size="12">function</text>
  <text x="155" y="235" fill="#F8FAFC" font-family="monospace" font-size="12">search(root, key) {</text>
  <text x="105" y="260" fill="#F43F5E" font-family="monospace" font-size="12">if</text>
  <text x="125" y="260" fill="#F8FAFC" font-family="monospace" font-size="12">(!root || root.val === key)</text>
  <text x="120" y="285" fill="#F43F5E" font-family="monospace" font-size="12">return</text>
  <text x="175" y="285" fill="#F8FAFC" font-family="monospace" font-size="12">root;</text>
  <text x="105" y="310" fill="#F43F5E" font-family="monospace" font-size="12">if</text>
  <text x="125" y="310" fill="#F8FAFC" font-family="monospace" font-size="12">(root.val &lt; key)</text>
  <text x="120" y="335" fill="#F43F5E" font-family="monospace" font-size="12">return</text>
  <text x="175" y="335" fill="#F8FAFC" font-family="monospace" font-size="12">search(root.right, key);</text>
  <text x="105" y="360" fill="#F43F5E" font-family="monospace" font-size="12">return</text>
  <text x="160" y="360" fill="#F8FAFC" font-family="monospace" font-size="12">search(root.left, key);</text>
  <text x="90" y="385" fill="#F8FAFC" font-family="monospace" font-size="12">}</text>

  <text x="75" y="440" fill="#D0E8FF" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">Time Complexity: O(log N)</text>
  <text x="75" y="470" fill="#BAE6FD" font-family="system-ui, sans-serif" font-size="12">Full-Stack Application Development Ready</text>

  <!-- Right: Metrics -->
  <rect x="410" y="120" width="340" height="200" rx="16" fill="#0A3663" stroke="#2A9DF4" stroke-width="1.5"/>
  <text x="435" y="155" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="16" font-weight="bold">Curriculum Milestones</text>
  
  <rect x="435" y="180" width="135" height="50" rx="8" fill="#021B36" stroke="#2A9DF4" stroke-width="1"/>
  <text x="445" y="210" fill="#D0E8FF" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">⚙️ DSA &amp; Algos</text>

  <rect x="590" y="180" width="135" height="50" rx="8" fill="#021B36" stroke="#2A9DF4" stroke-width="1"/>
  <text x="600" y="210" fill="#D0E8FF" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">🌐 React &amp; Node</text>

  <rect x="435" y="245" width="135" height="50" rx="8" fill="#021B36" stroke="#2A9DF4" stroke-width="1"/>
  <text x="445" y="275" fill="#D0E8FF" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">🗄️ SQL &amp; Mongo</text>

  <rect x="590" y="245" width="135" height="50" rx="8" fill="#021B36" stroke="#2A9DF4" stroke-width="1"/>
  <text x="600" y="275" fill="#D0E8FF" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">🚀 Git CI/CD</text>

  <!-- Lower Right: Stats -->
  <rect x="410" y="340" width="340" height="200" rx="16" fill="#0A3663" stroke="#2A9DF4" stroke-width="1.5"/>
  <text x="435" y="375" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="16" font-weight="bold">Industry Readiness Score</text>

  <circle cx="500" cy="450" r="45" fill="none" stroke="#021B36" stroke-width="10"/>
  <circle cx="500" cy="450" r="45" fill="none" stroke="#2A9DF4" stroke-width="10" stroke-dasharray="260" stroke-dashoffset="30"/>
  <text x="480" y="458" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="20" font-weight="bold">94%</text>

  <text x="580" y="440" fill="#D0E8FF" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">Stipend Qualifier</text>
  <text x="580" y="465" fill="#BAE6FD" font-family="system-ui, sans-serif" font-size="12">Top Tier Placement</text>
</svg>
