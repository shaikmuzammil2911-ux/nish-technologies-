<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B"/>
      <stop offset="50%" stop-color="#1C2541"/>
      <stop offset="100%" stop-color="#0A1128"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0066FF"/>
      <stop offset="100%" stop-color="#00D2FF"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGrad)"/>
  
  <!-- Grid overlay -->
  <g opacity="0.12" stroke="#00D2FF" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="0" y1="500" x2="800" y2="500"/>
    <line x1="150" y1="0" x2="150" y2="600"/>
    <line x1="300" y1="0" x2="300" y2="600"/>
    <line x1="450" y1="0" x2="450" y2="600"/>
    <line x1="600" y1="0" x2="600" y2="600"/>
    <line x1="750" y1="0" x2="750" y2="600"/>
  </g>

  <!-- Header Badge -->
  <rect x="50" y="40" width="700" height="60" rx="12" fill="#1E293B" stroke="#0066FF" stroke-width="1.5"/>
  <text x="75" y="77" fill="#00D2FF" font-family="system-ui, sans-serif" font-size="20" font-weight="bold">DATA ANALYST &amp; BUSINESS INTELLIGENCE</text>
  <text x="610" y="76" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="14">SQL • TABLEAU • EXCEL</text>

  <!-- Left Card: SQL Editor -->
  <rect x="50" y="120" width="330" height="420" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
  <circle cx="75" cy="145" r="6" fill="#EF4444"/>
  <circle cx="95" cy="145" r="6" fill="#F59E0B"/>
  <circle cx="115" cy="145" r="6" fill="#10B981"/>
  <text x="135" y="150" fill="#94A3B8" font-family="monospace" font-size="12">query_analysis.sql</text>
  
  <text x="75" y="195" fill="#F43F5E" font-family="monospace" font-size="14" font-weight="bold">SELECT</text>
  <text x="75" y="220" fill="#F8FAFC" font-family="monospace" font-size="13">  d.domain_name,</text>
  <text x="75" y="245" fill="#F8FAFC" font-family="monospace" font-size="13">  COUNT(c.candidate_id) AS total,</text>
  <text x="75" y="270" fill="#F8FAFC" font-family="monospace" font-size="13">  AVG(c.score_pct) AS avg_score</text>
  <text x="75" y="300" fill="#F43F5E" font-family="monospace" font-size="14" font-weight="bold">FROM</text>
  <text x="75" y="325" fill="#38BDF8" font-family="monospace" font-size="13">  nti_candidates c</text>
  <text x="75" y="355" fill="#F43F5E" font-family="monospace" font-size="14" font-weight="bold">JOIN</text>
  <text x="75" y="380" fill="#38BDF8" font-family="monospace" font-size="13">  nti_domains d ON c.dom_id = d.id</text>
  <text x="75" y="410" fill="#F43F5E" font-family="monospace" font-size="14" font-weight="bold">GROUP BY</text>
  <text x="75" y="435" fill="#F8FAFC" font-family="monospace" font-size="13">  d.domain_name</text>
  <text x="75" y="465" fill="#F43F5E" font-family="monospace" font-size="14" font-weight="bold">ORDER BY</text>
  <text x="75" y="490" fill="#F8FAFC" font-family="monospace" font-size="13">  total DESC LIMIT 10;</text>

  <!-- Right Side: Analytics Charts -->
  <rect x="400" y="120" width="350" height="200" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
  <text x="425" y="155" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="16" font-weight="bold">Performance Metrics &amp; Revenue</text>
  
  <!-- Bar chart -->
  <rect x="430" y="240" width="32" height="60" rx="4" fill="#0066FF"/>
  <rect x="475" y="210" width="32" height="90" rx="4" fill="#00D2FF"/>
  <rect x="520" y="180" width="32" height="120" rx="4" fill="#38BDF8"/>
  <rect x="565" y="200" width="32" height="100" rx="4" fill="#6366F1"/>
  <rect x="610" y="170" width="32" height="130" rx="4" fill="#10B981" filter="url(#glow)"/>
  <rect x="655" y="190" width="32" height="110" rx="4" fill="#8B5CF6"/>
  <rect x="700" y="220" width="32" height="80" rx="4" fill="#EC4899"/>

  <!-- Lower Right Card: KPI Highlights -->
  <rect x="400" y="340" width="350" height="200" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
  
  <rect x="420" y="360" width="145" height="75" rx="10" fill="#0F172A" stroke="#00D2FF" stroke-width="1"/>
  <text x="435" y="385" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">Conversion Rate</text>
  <text x="435" y="418" fill="#10B981" font-family="system-ui, sans-serif" font-size="24" font-weight="bold">+28.4%</text>

  <rect x="585" y="360" width="145" height="75" rx="10" fill="#0F172A" stroke="#8B5CF6" stroke-width="1"/>
  <text x="600" y="385" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">Avg Query Latency</text>
  <text x="600" y="418" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="24" font-weight="bold">14.2 ms</text>

  <!-- Trend wave -->
  <path d="M 425 500 Q 480 460, 540 480 T 660 450 T 730 470" fill="none" stroke="#00D2FF" stroke-width="3" filter="url(#glow)"/>
  <circle cx="730" cy="470" r="5" fill="#00D2FF"/>
</svg>
