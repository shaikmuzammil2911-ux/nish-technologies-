<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradMech" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1035"/>
      <stop offset="50%" stop-color="#2E1065"/>
      <stop offset="100%" stop-color="#0F0C20"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#bgGradMech)"/>

  <!-- Header -->
  <rect x="50" y="40" width="700" height="60" rx="12" fill="#2E1065" stroke="#8B5CF6" stroke-width="1.5"/>
  <text x="75" y="77" fill="#C4B5FD" font-family="system-ui, sans-serif" font-size="20" font-weight="bold">MECHANICAL CAD/CAM &amp; AUTOMATION</text>
  <text x="590" y="76" fill="#DDD6FE" font-family="system-ui, sans-serif" font-size="14">SOLIDWORKS • ANSYS • FEA</text>

  <!-- Left: 3D Gear and Part Draft -->
  <rect x="50" y="120" width="340" height="420" rx="16" fill="#240E3E" stroke="#8B5CF6" stroke-width="1.5"/>
  <text x="75" y="155" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="16" font-weight="bold">Parametric 3D CAD Assembly</text>

  <!-- Gear Wheels -->
  <g transform="translate(180, 270)">
    <circle cx="0" cy="0" r="70" fill="none" stroke="#8B5CF6" stroke-width="8"/>
    <circle cx="0" cy="0" r="45" fill="#1E1035" stroke="#C4B5FD" stroke-width="2"/>
    <circle cx="0" cy="0" r="18" fill="#8B5CF6"/>
    <!-- Cog teeth -->
    <rect x="-10" y="-85" width="20" height="20" fill="#8B5CF6"/>
    <rect x="-10" y="65" width="20" height="20" fill="#8B5CF6"/>
    <rect x="-85" y="-10" width="20" height="20" fill="#8B5CF6"/>
    <rect x="65" y="-10" width="20" height="20" fill="#8B5CF6"/>
    <rect x="-60" y="-60" width="20" height="20" fill="#8B5CF6" transform="rotate(45)"/>
    <rect x="40" y="40" width="20" height="20" fill="#8B5CF6" transform="rotate(45)"/>
    <rect x="-60" y="40" width="20" height="20" fill="#8B5CF6" transform="rotate(45)"/>
    <rect x="40" y="-60" width="20" height="20" fill="#8B5CF6" transform="rotate(45)"/>
  </g>

  <g transform="translate(290, 350)">
    <circle cx="0" cy="0" r="45" fill="none" stroke="#A78BFA" stroke-width="6"/>
    <circle cx="0" cy="0" r="28" fill="#1E1035" stroke="#C4B5FD" stroke-width="2"/>
    <circle cx="0" cy="0" r="12" fill="#A78BFA"/>
  </g>

  <text x="75" y="450" fill="#C4B5FD" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">Tolerance: ±0.005 mm (GD&amp;T Class 6)</text>
  <text x="75" y="480" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">FEA Von-Mises Stress Analysis Validated</text>

  <!-- Right: Metrics -->
  <rect x="410" y="120" width="340" height="200" rx="16" fill="#240E3E" stroke="#8B5CF6" stroke-width="1.5"/>
  <text x="435" y="155" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="16" font-weight="bold">Structural Simulation Metrics</text>
  
  <rect x="435" y="180" width="140" height="75" rx="10" fill="#1E1035"/>
  <text x="450" y="205" fill="#DDD6FE" font-family="system-ui, sans-serif" font-size="12">Factor of Safety</text>
  <text x="450" y="238" fill="#34D399" font-family="system-ui, sans-serif" font-size="24" font-weight="bold">3.2 FOS</text>

  <rect x="590" y="180" width="140" height="75" rx="10" fill="#1E1035"/>
  <text x="605" y="205" fill="#DDD6FE" font-family="system-ui, sans-serif" font-size="12">Max Stress Yield</text>
  <text x="605" y="238" fill="#C4B5FD" font-family="system-ui, sans-serif" font-size="24" font-weight="bold">142 MPa</text>

  <!-- Lower Right: Stats -->
  <rect x="410" y="340" width="340" height="200" rx="16" fill="#240E3E" stroke="#8B5CF6" stroke-width="1.5"/>
  <text x="435" y="375" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="16" font-weight="bold">DFM Manufacturing Readiness</text>

  <rect x="435" y="405" width="290" height="25" rx="4" fill="#1E1035"/>
  <rect x="435" y="405" width="260" height="25" rx="4" fill="#8B5CF6"/>
  <text x="445" y="423" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">CNC Toolpath Generation: 92%</text>

  <rect x="435" y="445" width="290" height="25" rx="4" fill="#1E1035"/>
  <rect x="435" y="445" width="230" height="25" rx="4" fill="#10B981"/>
  <text x="445" y="463" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">Weight Optimization: -18.4%</text>
</svg>
