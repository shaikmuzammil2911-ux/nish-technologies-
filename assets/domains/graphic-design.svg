<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradGD" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A0B2E"/>
      <stop offset="50%" stop-color="#2D114D"/>
      <stop offset="100%" stop-color="#11052C"/>
    </linearGradient>
    <linearGradient id="gradOrange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#FB923C"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#bgGradGD)"/>

  <!-- Header -->
  <rect x="50" y="40" width="700" height="60" rx="12" fill="#2D114D" stroke="#F97316" stroke-width="1.5"/>
  <text x="75" y="77" fill="#FB923C" font-family="system-ui, sans-serif" font-size="20" font-weight="bold">GRAPHIC DESIGN &amp; BRAND IDENTITY</text>
  <text x="590" y="76" fill="#FED7AA" font-family="system-ui, sans-serif" font-size="14">PHOTOSHOP • ILLUSTRATOR</text>

  <!-- Left: Art Canvas -->
  <rect x="50" y="120" width="340" height="420" rx="16" fill="#240E3E" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="75" y="155" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="16" font-weight="bold">Vector Brand System</text>
  
  <!-- Geometric Logo Icon in Center -->
  <circle cx="220" cy="280" r="80" fill="none" stroke="#F97316" stroke-width="4"/>
  <polygon points="220,210 290,320 150,320" fill="none" stroke="#EC4899" stroke-width="4"/>
  <circle cx="220" cy="280" r="30" fill="#7C3AED" opacity="0.8"/>
  <circle cx="220" cy="280" r="12" fill="#FB923C"/>

  <!-- Swatches -->
  <rect x="75" y="400" width="45" height="35" rx="6" fill="#F97316"/>
  <rect x="130" y="400" width="45" height="35" rx="6" fill="#EC4899"/>
  <rect x="185" y="400" width="45" height="35" rx="6" fill="#8B5CF6"/>
  <rect x="240" y="400" width="45" height="35" rx="6" fill="#3B82F6"/>
  <rect x="295" y="400" width="45" height="35" rx="6" fill="#10B981"/>

  <text x="75" y="480" fill="#FED7AA" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">Typography: Inter / Outfit Display</text>
  <text x="75" y="505" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">Mastering Vector Bezier curves &amp; layout hierarchy</text>

  <!-- Right: Tools and Assets -->
  <rect x="410" y="120" width="340" height="200" rx="16" fill="#240E3E" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="435" y="155" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="16" font-weight="bold">Brand Identity Deliverables</text>
  
  <rect x="435" y="180" width="135" height="50" rx="8" fill="#1E1035" stroke="#F97316" stroke-width="1"/>
  <text x="445" y="210" fill="#FB923C" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">🎨 Vector Logos</text>

  <rect x="590" y="180" width="135" height="50" rx="8" fill="#1E1035" stroke="#EC4899" stroke-width="1"/>
  <text x="600" y="210" fill="#F472B6" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">📐 Design Tokens</text>

  <rect x="435" y="245" width="135" height="50" rx="8" fill="#1E1035" stroke="#8B5CF6" stroke-width="1"/>
  <text x="445" y="275" fill="#A78BFA" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">📱 Social Kits</text>

  <rect x="590" y="245" width="135" height="50" rx="8" fill="#1E1035" stroke="#3B82F6" stroke-width="1"/>
  <text x="600" y="275" fill="#60A5FA" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">🖨️ Print Media</text>

  <!-- Lower Right: Visual Harmony -->
  <rect x="410" y="340" width="340" height="200" rx="16" fill="#240E3E" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="435" y="375" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="16" font-weight="bold">Visual Contrast &amp; Golden Ratio</text>

  <circle cx="500" cy="450" r="50" fill="none" stroke="#F97316" stroke-width="2"/>
  <circle cx="530" cy="450" r="30" fill="none" stroke="#EC4899" stroke-width="2"/>
  <circle cx="550" cy="450" r="20" fill="none" stroke="#8B5CF6" stroke-width="2"/>
  <circle cx="560" cy="450" r="10" fill="#10B981"/>

  <text x="610" y="440" fill="#FB923C" font-family="system-ui, sans-serif" font-size="20" font-weight="bold">1.618 : 1</text>
  <text x="610" y="465" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">Harmonic Balance</text>
</svg>
